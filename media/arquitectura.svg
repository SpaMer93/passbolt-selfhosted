<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"
     font-family="ui-sans-serif,system-ui,sans-serif">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="40" y="42" fill="#e6edf3" font-size="17" font-weight="600">Passbolt CE auto-hospedado</text>
  <text x="40" y="64" fill="#8b949e" font-size="12">TLS real · solo en red privada · respaldo externo verificado</text>

  <!-- contenedor 1: cliente -->
  <rect x="40" y="100" width="240" height="86" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="58" y="128" fill="#e6edf3" font-size="13" font-weight="600">Extensión del navegador</text>
  <text x="58" y="150" fill="#8b949e" font-size="11">Cripto en el cliente:</text>
  <text x="58" y="168" fill="#8b949e" font-size="11">el servidor nunca ve el secreto</text>

  <!-- flecha cliente -> proxy -->
  <line x1="280" y1="143" x2="360" y2="143" stroke="#2f81f7" stroke-width="2"/>
  <polygon points="360,143 350,138 350,148" fill="#2f81f7"/>
  <text x="292" y="134" fill="#2f81f7" font-size="10">TLS 443/9444</text>

  <!-- tailnet -->
  <rect x="360" y="100" width="160" height="86" rx="8" fill="#0d2818" stroke="#2ea043"/>
  <text x="378" y="128" fill="#3fb950" font-size="13" font-weight="600">Red privada</text>
  <text x="378" y="150" fill="#8b949e" font-size="11">WireGuard (tailnet)</text>
  <text x="378" y="168" fill="#8b949e" font-size="11">sin IP pública</text>

  <line x1="520" y1="143" x2="600" y2="143" stroke="#2f81f7" stroke-width="2"/>
  <polygon points="600,143 590,138 590,148" fill="#2f81f7"/>

  <!-- contenedor 2: stack -->
  <rect x="600" y="80" width="260" height="126" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="618" y="106" fill="#e6edf3" font-size="13" font-weight="600">Docker Compose</text>
  <rect x="618" y="118" width="106" height="34" rx="6" fill="#1f6feb"/>
  <text x="634" y="140" fill="#ffffff" font-size="12" font-weight="600">Caddy 2</text>
  <text x="736" y="140" fill="#8b949e" font-size="11">cert real</text>
  <rect x="618" y="160" width="106" height="34" rx="6" fill="#1f6feb"/>
  <text x="628" y="182" fill="#ffffff" font-size="12" font-weight="600">Passbolt CE</text>
  <rect x="740" y="160" width="102" height="34" rx="6" fill="#8957e5"/>
  <text x="752" y="182" fill="#ffffff" font-size="12" font-weight="600">MariaDB 10.11</text>
  <line x1="724" y1="177" x2="740" y2="177" stroke="#8b949e" stroke-width="2"/>

  <!-- volúmenes -->
  <rect x="600" y="228" width="118" height="52" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="612" y="248" fill="#e6edf3" font-size="11">gpg / jwt</text>
  <text x="612" y="266" fill="#f85149" font-size="10">llave del servidor</text>
  <rect x="742" y="228" width="118" height="52" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="754" y="248" fill="#e6edf3" font-size="11">datos</text>
  <text x="754" y="266" fill="#8b949e" font-size="10">sobres cifrados</text>

  <!-- flujo de respaldo -->
  <line x1="659" y1="280" x2="659" y2="330" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="801" y1="280" x2="801" y2="330" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="520" y="330" width="340" height="64" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="538" y="354" fill="#d29922" font-size="12" font-weight="600">Respaldo diario cifrado</text>
  <text x="538" y="374" fill="#8b949e" font-size="11">rotación por antigüedad · verificación de cada copia</text>

  <!-- 3 copias -->
  <rect x="520" y="418" width="104" height="44" rx="6" fill="#0d2818" stroke="#2ea043"/>
  <text x="536" y="446" fill="#3fb950" font-size="12" font-weight="600">copia 1</text>
  <rect x="638" y="418" width="104" height="44" rx="6" fill="#0d2818" stroke="#2ea043"/>
  <text x="654" y="446" fill="#3fb950" font-size="12" font-weight="600">copia 2</text>
  <rect x="756" y="418" width="104" height="44" rx="6" fill="#0d2818" stroke="#2ea043"/>
  <text x="766" y="446" fill="#3fb950" font-size="12" font-weight="600">fuera del sitio</text>

  <!-- verificación -->
  <rect x="40" y="330" width="440" height="132" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="58" y="356" fill="#e6edf3" font-size="13" font-weight="600">Verificación de restauración</text>
  <text x="58" y="380" fill="#8b949e" font-size="11">1 · descifrar la copia fuera del sitio</text>
  <text x="58" y="400" fill="#8b949e" font-size="11">2 · importar y arrancar el stack</text>
  <text x="58" y="420" fill="#8b949e" font-size="11">3 · comparar fingerprint con /auth/verify.json</text>
  <text x="58" y="440" fill="#3fb950" font-size="11" font-weight="600">4 · fingerprint idéntico = nadie pierde su cuenta</text>
  <text x="40" y="500" fill="#8b949e" font-size="11">Incidente real: 11 usuarios · 322 recursos · 330 secretos restaurados · healthcheck OK</text>
  <text x="40" y="524" fill="#6e7681" font-size="10">© 2026 Javier Cuevas · documentación de exhibición</text>
</svg>
